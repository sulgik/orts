[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orts"
version = "2.1.0"
description = "Odds-Ratio Thompson Sampling: Thompson sampling for A/B tests and bandits whose baseline keeps moving"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Sulgi Kim", email = "sulgik@gmail.com" }]
keywords = ["multi-armed bandit", "Thompson sampling", "A/B testing", "adaptive experiment", "odds ratio", "logistic regression"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.22", "scipy>=1.8"]

[project.optional-dependencies]
dev = ["pytest>=7"]
examples = ["matplotlib>=3.5"]

[project.urls]
Repository = "https://github.com/sulgik/orts"
"Preprint (2020)" = "https://arxiv.org/abs/2003.01905"

[tool.setuptools]
packages = ["orts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:orts", "ignore::DeprecationWarning"]
